language: typescript
tasks:
  models:
    command: 'proto run node -- scripts/model-config/sync-models.mjs --check'
    inputs: ['models.yaml', 'models.json', 'model-profiles.yaml', 'settings.json', 'scripts/model-config/**/*', '@globs(lifecycle)', '@globs(protected)']
  test:
    command: 'proto run node -- scripts/verification/test-node.mjs --exclude "**/*.artifact.test.*" lib/test lib/data-root/test lib/development-runtime/test lib/process-lifecycle/test lib/sensitive-data/test lib/structured-logging/test lib/temporary-files/test lib/transcript/test'
    # Exact compatibility facade imports from lib-owned tests.
    inputs: ['/lib/**/*', '/harness/agent-processes/lib/rpc/jsonl.ts', '/harness/session-storage/ownership/session-identity.ts', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  graphTest:
    command: 'proto run node -- --test scripts/verification/test/moon-test-selectors.test.mjs'
    env: {PIE_RUN_MOON_INPUT_TESTS: '1'}
    inputs: ['moon.yml', '**/moon.yml', 'scripts/verification/test/moon-test-selectors.test.mjs', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  deliveryQualification:
    command: 'proto run node -- scripts/verification/qualify-delivery.mjs'
    inputs: ['application/**/*', 'harness/**/*', '!harness/pi-runtime/.cache/**/*', 'lib/**/*', 'scripts/**/*', 'settings.defaults.json', 'models.json', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  artifactTest:
    command: 'proto run node -- scripts/verification/test-artifact.mjs'
    deps: ['pi:build']
    inputs: ['harness/pi/packages/**/*', 'harness/agent-processes/**/*', 'harness/session-storage/**/*', 'harness/tool-and-skill-selection/**/*', 'harness/tools/playwright/**/*', 'harness/model-providers/model-discovery/**/*', 'harness/model-providers/runtime/**/*', 'harness/model-providers/management/**/*', 'harness/tools/package-integrations/web-access/**/*', 'harness/tools/subagent/**/*', 'harness/tools/warm-bash/**/*', 'application/backend/**/*', 'scripts/install/test/**/*', 'scripts/lib/test/**/*', 'scripts/development/**/*', 'scripts/development/test/**/*', 'test/integration/**/*', 'scripts/build/pi-runtime.mjs', 'lib/development-runtime/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
