language: typescript
tasks:
  build:
    command: 'proto run node -- scripts/build/pi-workspace.mjs'
    inputs: ['/harness/pi/**/*', '/lib/**/*', '@globs(lifecycle)', '/scripts/build/pi-workspace.mjs', '/scripts/build/pi-runtime.mjs', '@globs(protected)']
    outputs: ['packages/tui/dist', 'packages/ai/dist', 'packages/agent/dist', 'packages/coding-agent/dist', '.cache/build.json']
    options:
      # Cache hydration must also respect reader exclusion. Until a gated
      # hydration hook is qualified, compilation is incremental, not cached.
      cache: false
  test:
    command: noop
    deps: ['testTui', 'testAi', 'testAgent', 'testCodingAgent']
    inputs: ['/harness/pi/**/*', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  testTui:
    command: 'proto run node -- scripts/verification/test-node.mjs harness/pi/packages/tui/test'
    deps: ['build']
    inputs: ['/harness/pi/packages/tui/**/*', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  testAgent:
    command: 'proto run node -- scripts/verification/test-framework-offline.mjs --package agent --'
    # Ordinary suites use private state, stripped credentials and local-LLM gates.
    deps: ['build']
    inputs: ['/harness/pi/packages/agent/**/*', '/harness/pi/packages/ai/**/*', '/scripts/verification/test-framework-offline.mjs', '/scripts/development/test/vscode-development-stub.cjs', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  testAi:
    command: 'proto run node -- scripts/verification/test-framework-offline.mjs --package ai --'
    deps: ['build']
    inputs: ['/harness/pi/packages/ai/**/*', '/scripts/verification/test-framework-offline.mjs', '/scripts/development/test/vscode-development-stub.cjs', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  testCodingAgent:
    command: 'proto run node -- scripts/verification/test-framework-offline.mjs --package coding-agent --'
    deps: ['build']
    inputs: ['/harness/pi/packages/**/*', '/scripts/verification/test-framework-offline.mjs', '/scripts/development/test/vscode-development-stub.cjs', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
