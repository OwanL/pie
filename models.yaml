#
# Models that have been removed from `providers` (and `profileOrder`) but still
# appear in historical analytics snapshots. Each entry carries the provider,
# name, optional `family`, and `pricing` the model had at retirement so that
# cost derivation and family/provider attribution keep working for past runs.
#
# These entries are NOT added to `profileOrder` or the active picker — they are
# read-only pricing/attribution metadata. `scripts/sync-models.mjs` emits them
# to `analysis/model-pricing-history.json`, which the analysis pricing/family
# loaders merge as a fallback: active provider-specific pricing always wins;
# historical entries only fill identities missing from the active catalog.
