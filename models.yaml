# pie model configuration — SINGLE SOURCE OF TRUTH.
#
# Edit this file to add/change models, then run:  npm run sync-models
# (or: node scripts/sync-models.mjs --check  to verify drift).
#
# Do NOT edit the derived files directly:
#   models.json, model-profiles.yaml, proxy/litellm_config.yaml, settings.json
# They are regenerated from this file by scripts/sync-models.mjs.
#
# Field flow (see docs/internal/centralized-model-config.md §4):
#   pricing:{input,output,cacheRead,cacheWrite} -> models.json cost:{...} (USD/M-token)
#   costRank:N            -> model-profiles.yaml cost:N (0-30 fallback ranking)
#   disabledReason        -> model-profiles.yaml disabled_reason (snake_case)
#   eligible/thinking     -> model-profiles.yaml
#   overrideOnly:true     -> models.json providers.<p>.modelOverrides (vs models[])
#   defaults/retry/pruning-> settings.json (defaults only SEEDS the user-owned
#                           defaultModel/Provider/ThinkingLevel when absent;
#                           retry + pruning.{model,provider,thinkingLevel} are
#                           re-derived on every sync)
#   proxy.* (settings.json)-> proxy/litellm_config.yaml (proxy SSoT = settings.json)
#
# Proxy settings (the LiteLLM gateway + per-provider upstream routing) live in
# settings.json `proxy` — that is the user-editable source of truth, surfaced in
# the pie UI. sync-models reads it from settings.json and injects it into
# proxy/litellm_config.yaml. models.yaml only owns the model CATALOG.
#
# profileOrder lists the order of entries in generated model-profiles.yaml.

defaults:
  model: glm-5.2:cloud
  provider: ollama
  thinkingLevel: high
retry:
