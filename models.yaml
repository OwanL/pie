# pie model configuration — SINGLE SOURCE OF TRUTH.
#
# Edit this file to add/change models, then run:  npm run sync-models
# (or: node scripts/sync-models.mjs --check  to verify drift).
#
# Do NOT edit the derived files directly:
#   models.json, model-profiles.yaml, settings.json
# They are regenerated from this file by scripts/sync-models.mjs.
#
# Field flow (see docs/internal/centralized-model-config.md §4):
#   pricing:{input,output,cacheRead,cacheWrite} -> models.json cost:{...} (USD/M-token)
#   disabledReason        -> model-profiles.yaml disabled_reason (snake_case)
#   eligible/thinking     -> model-profiles.yaml
#   input/maxImagesPerRequest -> models.json provider-qualified request policy
#   overrideOnly:true     -> models.json providers.<p>.modelOverrides (vs models[])
#   defaults/pruning      -> settings.json seeds for user-owned chat/pruning
#                           selections (only when the corresponding value is absent)
#   retry                 -> settings.json retry config (re-derived every sync)
#   concurrency:{...}      -> models.json providers.<p>.concurrency (host-side
#                           provider gate reads this at runtime to enforce
#                           per-provider concurrency + afterburn sticky slots)
#
# Image-capable entries currently use the conservative policy maximum 1. Their
# provider/runtime capability declarations establish one-image acceptance; raise
# a limit only with provider-qualified documentation or measured acceptance
# evidence, never by inferring behavior from a model family name.

defaults:
  model: glm-5.2:cloud
  provider: ollama
  thinkingLevel: high
retry:
  enabled: true
  maxRetries: 8
  baseDelayMs: 5000
  provider:
    maxRetries: 2
    maxRetryDelayMs: 60000
# Initial pruning selection for fresh settings. The settings UI owns existing
# pruning.model/provider/thinkingLevel values; sync never overwrites them.
pruning:
  model: gpt-5-mini
  provider: github-copilot
  thinkingLevel: low
