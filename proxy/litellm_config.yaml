# pie LiteLLM proxy config
#
# Routes API-key providers (umans + future) through a single local gateway with
# per-provider concurrency limits, so subagent fan-out can't burst the upstream
# account. GitHub Copilot and Ollama stay direct (see proxy/README.md).
#
# Run:  cd proxy && uv run litellm --config litellm_config.yaml --port 4000
#   or: npm run proxy / npm run proxy:bg  (from the pie root)
#
# Docs: https://docs.litellm.ai/docs/proxy/quick_start
#
# Operational notes (preserved from the hand-written original):
#   - max_parallel_requests lives in litellm_params (LiteLLM reads it there,
#     litellm/types/router.py), NOT under per-entry router_settings, and the key
#     is max_parallel_requests (max_concurrent_requests is silently ignored).
#   - All umans variants share ONE model_info.id (umans-shared) so LiteLLM creates
#     a single Semaphore across every variant (account-wide cap, not per-model).
#   - Do NOT set request_timeout in litellm_settings: it is a whole-request
#     ceiling, not an idle/first-byte timeout, and would abort long streaming
#     generations. The real ceiling is router_settings.timeout (600s).
#   - master_key MUST match the backend's Authorization or LiteLLM 400s with
#     "No connected db" (we run DB-less). It is set to the umans key from the
#     environment; localhost-only gate (proxy binds 127.0.0.1).
model_list:
  - model_name: umans
    litellm_params:
      model: openai/umans-coder
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
