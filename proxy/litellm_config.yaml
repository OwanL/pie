# pie LiteLLM proxy config
#
# Routes API-key providers (umans + future) through a single local gateway with
# per-provider concurrency limits, so subagent fan-out can't burst the upstream
# account. GitHub Copilot and Ollama stay direct (see proxy/README.md).
#
# Run:  cd proxy && uv run litellm --config litellm_config.yaml --port 4000
#   or: npm run proxy / npm run proxy:bg  (from the pie root)
#
# Docs: https://docs.litellm.ai/docs/proxy/quick_start

model_list:
  # ── umans ────────────────────────────────────────────────────────────────
  # The real upstream. LiteLLM forwards to https://api.code.umans.ai/v1 using
  # the UMANS_API_KEY from the environment. pi's models.json points the umans
  # *provider* at http://localhost:4000/v1 instead, so every umans request
  # funnels through here.
  #
  # max_parallel_requests: 4 maps directly to umans' "4 concurrent active
  # sessions" account limit. Each in-flight HTTP request to umans = one active
  # session; while pi does local tool work between model calls, no request is
  # in flight and the slot frees (matching the dashboard's 1/4 → 0/4 pause).
  # A 5th concurrent request QUEUES here instead of 429-ing upstream — this is
  # the backpressure pie was missing.
  #
  # IMPORTANT: the limit must live in `litellm_params` (LiteLLM reads it from
  # there — litellm/types/router.py), NOT under a per-entry `router_settings`
  # block, and the key is `max_parallel_requests`, not `max_concurrent_requests`
  # (the latter is silently ignored — see proxy/test/test_config.py).
  #
  # All umans variants share ONE `model_info.id` (`umans-shared`) so LiteLLM
  # creates a single Semaphore(4) across every variant. umans' limit is
  # account-wide, not per-model; without the shared id each variant would get
  # its own 4-slot semaphore and a fan-out across variants could burst to
  # 4 × N upstream. The shared id makes the queue a true global cap.
  - model_name: umans                    # what pie requests
    litellm_params:
      model: openai/umans-coder          # litellm syntax: <litellm_provider>/<upstream_model_id>
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
      # umans is OpenAI-compatible; LiteLLM's openai/* route handles it.
    model_info:
      id: umans-shared
  - model_name: umans-coder
    litellm_params:
      model: openai/umans-coder
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared
  - model_name: umans-flash
    litellm_params:
      model: openai/umans-flash
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared
  - model_name: umans-kimi-k2.7
    litellm_params:
      model: openai/umans-kimi-k2.7
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared
  - model_name: umans-kimi-k2.6
    litellm_params:
      model: openai/umans-kimi-k2.6
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared
  - model_name: umans-glm-5.2
    litellm_params:
      model: openai/umans-glm-5.2
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared
  - model_name: umans-glm-5.1
    litellm_params:
      model: openai/umans-glm-5.1
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared
  - model_name: umans-qwen3.6-35b-a3b
    litellm_params:
      model: openai/umans-qwen3.6-35b-a3b
      api_base: https://api.code.umans.ai/v1
      api_key: os.environ/UMANS_API_KEY
      max_parallel_requests: 4
    model_info:
      id: umans-shared

  # ── Future API-key providers go here ─────────────────────────────────────
  # Add a model_list entry (with its own `litellm_params.max_parallel_requests`
  # and a DISTINCT `model_info.id`) and a
  # matching baseUrl redirect block in ../../models.json. Copilot/Ollama stay
  # direct — do NOT add them here (see proxy/README.md).

router_settings:
  # Queue overflows locally (RAM) until an upstream slot frees. With only the
  # umans 4-concurrent limit in play this never grows large in practice.
  num_retries: 2
  retry_after: true                      # honour upstream Retry-After headers
  timeout: 600                            # per-request ceiling (seconds) — generous; pi has its own

litellm_settings:
  # Drop fine-grained telemetry noise; pie's own analysis/ workspace is the
  # source of truth for run analytics. LiteLLM's built-in spend log is still
  # written to data/proxy/litellm_logs/ for ad-hoc inspection.
  drop_params: true
  # NOTE: do NOT set `request_timeout` here. It is a whole-request ceiling,
  # NOT an idle/first-byte timeout. pi streams umans completions
  # (`openai-completions` provider, stream:true); a long generation keeps the
  # HTTP connection open for minutes. A 60s value (previously set here) was
  # silently aborting those streams mid-generation, which surfaced to pi as
  # "the session just stopped." The real ceiling is router_settings.timeout
  # above (600s). Leave this block free of any timeout knob.

general_settings:
  # The master_key MUST match whatever Authorization the backend sends, or
  # LiteLLM falls through to a virtual-key DB lookup and 400s with
  # "No connected db" (we run DB-less). pi's auth priority is runtime override
  # → auth.json → models.json apiKey → env var, and auth.json typically already
  # holds the real umans key, so we set master_key to the SAME umans key from
  # the environment. This is still a localhost-only gate (the proxy binds to
  # 127.0.0.1 via --host); it is NOT a cloud-secret reuse. See proxy/README.md
  # §Master key.
  master_key: os.environ/UMANS_API_KEY
  # No DB — in-memory only. Pie does not currently need persistent spend/usage
  # from LiteLLM; if that changes, add database_url: "postgresql://...".
