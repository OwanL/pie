language: typescript
dependsOn: [analytics, harness, root]
tasks:
  test:
    command: 'proto run node -- scripts/verification/test-node.mjs --exclude "**/*.artifact.test.*" analytics/analysis/test'
    inputs: ['/analytics/analysis/**/*', '/analytics/**/*', '/harness/**/*', '/harness/pi/**/*', '/scripts/**/*', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
  typecheck:
    command: 'proto run node -- scripts/verification/typecheck-project.mjs analytics/analysis/tsconfig.json'
    inputs: ['/analytics/analysis/**/*', '/analytics/**/*', '/harness/**/*', '/harness/pi/**/*', '/scripts/**/*', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
