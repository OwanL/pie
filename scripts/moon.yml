language: javascript
dependsOn: [root]
tasks:
  test:
    command: 'proto run node -- scripts/verification/test-node.mjs --exclude "**/*.artifact.test.*" scripts'
    # Build fixtures import application modules; shared generation support remains file-owned.
    inputs: ['/scripts/**/*', '/application/backend/**/*', '/application/hosts/lib/**/*', '/application/hosts/vscode/**/*', '/application/lib/**/*', '/analytics/**/*', '!/analytics/analysis/**/*', '/harness/**/*', '/harness/pi/**/*', '/lib/**/*', '@globs(lifecycle)', '@globs(protected)']
    options: {cache: false}
